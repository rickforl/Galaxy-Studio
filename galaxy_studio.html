<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Galaxy Studio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#05060a;font-family:'Consolas','Monaco',monospace;}
  #panel{position:fixed;top:31px;left:0;width:250px;max-height:calc(100vh - 31px);overflow-y:auto;
    background:rgba(8,12,20,0.92);border-right:1px solid #2a3a58;padding:8px 10px 40px;
    color:#b9c8e4;font:11px 'Consolas',monospace;z-index:10;box-sizing:border-box;}
  #topbar{position:fixed;top:0;left:0;right:0;height:31px;display:flex;align-items:center;gap:8px;padding:0 10px;
    background:rgba(6,10,16,0.96);border-bottom:1px solid #2a3a58;z-index:20;box-sizing:border-box;}
  #topbar .ttl{color:#8fb0e0;font-weight:bold;letter-spacing:1px;font-size:12px;}
  #build-pill{background:#16233b;color:#9fbce8;border:1px solid #3a5a8c;border-radius:9px;padding:1px 9px;font:10px 'Consolas',monospace;font-weight:bold;letter-spacing:.5px;}
  #topbar button{background:#16233b;color:#cdd9ef;border:1px solid #3a5a8c;font:11px 'Consolas',monospace;padding:3px 10px;cursor:pointer;}
  #topbar button:hover{background:#1e2f4d;}
  #fps-pill{background:#0c1524;color:#8fe0a8;border:1px solid #2a5a3a;font:11px 'Consolas',monospace;padding:3px 9px;cursor:pointer;min-width:58px;text-align:center;margin-left:auto;}
  #fps-pill:hover{background:#12331f;}
  #fps-sheet{position:fixed;top:36px;right:8px;width:214px;background:rgba(8,14,22,0.97);border:1px solid #3a5a8c;
    color:#cdd9ef;font:11px 'Consolas',monospace;padding:8px 10px;z-index:30;display:none;box-shadow:0 4px 14px rgba(0,0,0,0.5);}
  #fps-sheet .fps-h{color:#8fb0e0;font-weight:bold;letter-spacing:.5px;margin-bottom:6px;border-bottom:1px solid #223;padding-bottom:3px;}
  #fps-sheet table{width:100%;border-collapse:collapse;margin-bottom:6px;}
  #fps-sheet th,#fps-sheet td{text-align:right;padding:2px 4px;}
  #fps-sheet th:first-child,#fps-sheet td:first-child{text-align:left;color:#93a2bf;}
  #fps-sheet th{color:#6f7f9c;font-weight:normal;}
  #fps-sheet .fps-meta{color:#5f6f8c;font-size:10px;margin-bottom:8px;line-height:1.3;}
  #fps-sheet button{width:100%;background:#2a1620;color:#e0a8b8;border:1px solid #6a2a3a;font:11px 'Consolas',monospace;padding:4px;cursor:pointer;}
  #fps-sheet button:hover{background:#3a1e2a;}
  #nav{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:8px;}
  #nav .tab{background:#0c1524;color:#93a2bf;border:1px solid #223;font:10px 'Consolas',monospace;padding:3px 7px;cursor:pointer;}
  #nav .tab.on{background:#1e2f4d;color:#fff;border-color:#3a5a8c;}
  #panel h2{margin:2px 0 8px;font-size:12px;color:#fff;letter-spacing:.5px;}
  #panel h2 span{color:#7f9fd0;font-weight:normal;}
  #panel .grp{margin:11px 0 4px;color:#8fb0e0;font-weight:bold;border-bottom:1px solid #223;padding-bottom:2px;
    text-transform:uppercase;letter-spacing:.5px;font-size:10px;}
  #panel .row{display:flex;align-items:center;gap:6px;margin:3px 0;}
  #panel .lab{flex:0 0 92px;color:#93a2bf;}
  #panel input[type=range]{flex:1;min-width:0;accent-color:#7f9fd0;height:14px;}
  #panel input[type=checkbox]{accent-color:#7f9fd0;}
  #panel .val{flex:0 0 34px;text-align:right;color:#dfe8f8;}
  #panel input[type=color]{width:44px;height:18px;border:1px solid #2a3a58;background:none;padding:0;}
  #panel select{flex:1;min-width:0;background:#0c1524;color:#dfe8f8;border:1px solid #3a5a8c;font:11px 'Consolas',monospace;padding:1px;}
  #panel .hint{color:#5f6f8c;margin-top:10px;font-size:10px;line-height:1.4;}
  #panel .act-btn{width:100%;background:#16233b;color:#cdd9ef;border:1px solid #3a5a8c;font:11px 'Consolas',monospace;padding:5px;cursor:pointer;margin-top:10px;}
  #panel .act-btn:hover{background:#1e2f4d;}
</style>
</head><body>
<div id="topbar">
  <span class="ttl">GALAXY STUDIO</span>
  <span id="build-pill">&mdash;</span>
  <button id="mode-btn">&#9654; VIEW GALAXY</button>
  <span id="fps-pill" title="click for FPS records">FPS &mdash;</span>
  <button id="export-btn">Export</button>
  <button id="import-btn">Import</button>
  <input type="file" id="import-file" accept=".json" style="display:none">
</div>
<div id="fps-sheet"></div>
<div id="panel"><div id="nav"></div><div id="pagebody"></div></div>
<script>
// ===================================================================
// SUN EXHIBIT 03 — the full rich build (every effect) + a live options menu.
// One engine; each archived version is this file with a different ACTIVE_PRESET.
// ===================================================================

let ACTIVE_PRESET = 'current';   // starting sun preset (empty override = the CFG.sun defaults above)
const BUILD_DATE = '20260717';     // build day — reset SEQ to '01' on a new day
const BUILD_SEQ  = '23';           // per-day build sequencer — bump each build (01, 02, 03, ...)
const BUILD_ID   = 'v0.1_' + BUILD_DATE + '.' + BUILD_SEQ;   // shown in the build pill

// each effect draws live from OPTS so every slider updates instantly (single sun, so no baking needed
// except the plasma/filament noise textures, which are baked once and tinted/faded live).
// namespaced config — one source of truth every page writes and the view reads (Phase 0)
let CFG = {
  sun: {
    // GLOBAL
    previewR: 45, edge: 0.30, rot: 1.0, lodOn: false, bg: true, sunColor: [255, 180, 90],
    // CORE
    coreOn: false, coreOpacity: 1.0, specOn: true,
    plasmaOn: true, plasmaOpacity: 0.63,
    filamentOn: true, filamentOpacity: 0.47,
    // GLOW (corona haze)
    glowOn: false, glowOpacity: 0.5, glowSize: 2.6,
    // STREAMERS
    streamersOn: true, streamersOpacity: 0.5, streamerCount: 14, streamerLen: 3.4,
    // BLOOM (diffraction)
    bloomOn: true, bloomOpacity: 0.9, bloomLen: 4.5, bloomThick: 0.14, bloomAngle: 0, bloomGlow: false, bloomRandom: true, bloomLockAngle: true, bloomLockRot: true,
    // CHROMOSPHERE RIM
    rimOn: false, rimOpacity: 0.6, rimThick: 0.06,
    // PROMINENCE
    promOn: false, promOpacity: 0.6, promCount: 6, promHeight: 1.6,
    // EMBERS
    embersOn: false, embersOpacity: 0.7, embersCount: 90,
    // BAKE INCLUDES — which layers go into the baked galaxy sprite (unchecked = drawn live per star)
    bake_core: true, bake_glow: true, bake_streamers: false, bake_bloom: false, bake_rim: true, bake_prom: true, bake_embers: true
  },
  gen: { starCount: 60, radius: 1200, minDist: 130, useGalaxy01: true, starSize: 12, seed: 1234, bakedRender: true,
         wM: 1, wK: 1, wG: 1, wF: 1, wB: 1, wO: 1, jitter: 15 },
  backdrop: {
    cover: 1.5, bakeRes: 1024,                                                  // extent = gen.radius * cover ; baked-buffer resolution
    // BASE FILL
    baseOn: true, baseColor: [6, 8, 16], baseOpacity: 1.0,
    // IMAGE (curated photo gallery in galaxy_backgrounds/)
    imgOn: false, imgIndex: 3, imgHashPick: false, imgRot: 0, imgFlip: false, imgScale: 1.0, imgOpacity: 1.0,
    // NEBULA (procedural: domain-warp / fBm / emission noise field, or legacy blobs)
    nebOn: true, nebType: 'domainwarp', nebColorA: [40, 30, 90], nebColorB: [120, 40, 110], nebColorC: [245, 215, 185],
    nebScale: 1.0, nebOctaves: 5, nebWarp: 1.2, nebContrast: 1.4, nebThreshold: 0.15, nebOpacity: 1.2, nebCount: 42, nebSeed: 7,
    nebAnimOn: true, nebInterval: 5, nebStep: 0.05, nebBlend: 1.5,             // hold N s, then crossfade one step over nebBlend s
    // GRID OVERLAY
    gridOn: false, gridColor: [60, 90, 140], gridOpacity: 0.25, gridSpacing: 200, gridWeight: 1,
    // RADIAL FADE (vignette — hides image/nebula edge cutoff)
    fadeOn: true, fadeColor: [4, 5, 9], fadeInner: 0.55, fadeOuter: 1.0, fadeOpacity: 1.0,
    // BAKE INCLUDES — which layers go into the baked backdrop buffer (unchecked = drawn live)
    bake_base: true, bake_img: true, bake_neb: true, bake_grid: false, bake_fade: true
  },
  lanes: {}, traffic: {}, economy: {}   // filled in later phases
};
let OPTS = CFG.sun;                                 // sun renderer reads OPTS (=== CFG.sun) — unchanged downstream
const BASE = JSON.parse(JSON.stringify(CFG.sun));   // sun defaults — preset switching resets to these first

// milestone presets — overrides merged onto OPTS at startup (the archive versions)
const PRESETS = {
  current:       {},                                                                                              // 00 working default (= CFG.sun / imported cfg)
  full_rich:     { previewR: 90 },                                                                                 // 01 everything on, big
  lod_crossfade: { lodOn: true, previewR: 45 },                                                                    // 02 reactive LOD (mid size shows the crossfade)
  perf_cuts:     { lodOn: true, previewR: 45, embersOn: false, promOn: false, rimOn: false },                      // 03 cut embers/prom/rim
  edge_sweet:    { lodOn: true, previewR: 60, embersOn: false, promOn: false, rimOn: false, glowOn: false, edge: 0.39 }, // 04 0.39 feather
  stripped:      { lodOn: true, previewR: 70, embersOn: false, promOn: false, rimOn: false, glowOn: false, streamersOn: false, edge: 0.39 }, // 05 core+bloom
  glow_bloom:    { previewR:45, edge:0.30, rot:1.0, lodOn:true, bg:true, sunColor:[255,180,90], coreOn:false, coreOpacity:1.0, specOn:true, plasmaOn:false, plasmaOpacity:0.63, filamentOn:false, filamentOpacity:0.47, glowOn:true, glowOpacity:0.73, glowSize:3.6, streamersOn:false, streamersOpacity:0.5, streamerCount:14, streamerLen:3.4, bloomOn:true, bloomOpacity:0.9, bloomLen:4.5, bloomThick:0.14, bloomAngle:0, bloomGlow:false, bloomRandom:true, bloomLockAngle:true, bloomLockRot:true, rimOn:false, rimOpacity:0.6, rimThick:0.06, promOn:false, promOpacity:0.6, promCount:6, promHeight:1.6, embersOn:false, embersOpacity:0.7, embersCount:90, bake_core:false, bake_glow:true, bake_streamers:false, bake_bloom:false, bake_rim:true, bake_prom:true, bake_embers:true } // 06 glow bloom (imported cfg_02, full snapshot; sun-only — its gen starCount:300 not carried)
};
const PRESET_LABELS = { current:'★ current', full_rich:'01 full rich', lod_crossfade:'02 LOD crossfade', perf_cuts:'03 perf cuts', edge_sweet:'04 edge sweet-spot', stripped:'05 stripped', glow_bloom:'06 glow bloom' };

let plasmaBuf, filaBuf; const BUFN = 96;
const PANELW = 272;

function setup(){
  pixelDensity(1);   // hi-DPI (devicePixelRatio 1.5) would render at 2.25x pixels — pin to 1x for the FPS floor
  createCanvas(windowWidth, windowHeight);
  let urlp = new URLSearchParams(location.search).get('preset');   // ?preset=NAME override
  if (urlp && PRESETS[urlp]) ACTIVE_PRESET = urlp;
  plasmaBuf = createGraphics(BUFN, BUFN); plasmaBuf.pixelDensity(1);
  filaBuf   = createGraphics(BUFN, BUFN); filaBuf.pixelDensity(1);
  bakePlasma(); bakeFilament();
  showPage();                   // build nav + the active page's controls
  applyPreset(ACTIVE_PRESET);   // apply starting sun preset + sync controls
  document.getElementById('mode-btn').onclick   = toggleMode;
  document.getElementById('export-btn').onclick = exportCFG;
  document.getElementById('import-btn').onclick = () => document.getElementById('import-file').click();
  document.getElementById('import-file').onchange = (e) => { if (e.target.files[0]) importCFG(e.target.files[0]); };
  document.getElementById('fps-pill').onclick = toggleFpsSheet;
  document.getElementById('build-pill').textContent = BUILD_ID;
  loadFpsRecords();
  regenerate();                 // build the initial galaxy
  updateModeBtn();
}
function windowResized(){ resizeCanvas(windowWidth, windowHeight); }

let viewMode = 'options';   // 'options' (single-sun tuning) | 'galaxy' (full view)
function draw(){
  stepNebula(CFG.backdrop);                                                    // nebula: hold, then crossfade to the next stepped frame
  if (viewMode === 'galaxy') drawGalaxyView();
  else if (activePage === 'backdrop') drawBackdropPreview();   // isolated backdrop compilation (no sun/stars)
  else drawSunPreview();
  updateFps();
}
function drawBackdropPreview(){
  background(2,3,6);
  let E=bdExtent();
  let playX = PANELW + (width-PANELW)/2, playY = height/2;
  let fit = Math.min(width-PANELW, height) * 0.9 / (2*E);      // fit the 2E square into ~90% of the play area
  push(); translate(playX, playY); scale(fit); drawBackdrop(); pop();
  blendMode(BLEND); noStroke(); fill(120,140,175); textSize(11); textAlign(CENTER, BOTTOM);
  text('backdrop preview · extent '+Math.round(E)+' · bake '+CFG.backdrop.bakeRes+'²', playX, height-16);
}
function drawSunPreview(){
  background(OPTS.bg ? color(6,7,12) : color(1,1,2));
  let cx = PANELW + (width - PANELW) / 2, cy = height / 2;
  drawTheSun(cx, cy, OPTS.previewR, frameCount);
  blendMode(BLEND); noStroke(); fill(120,140,175); textSize(11); textAlign(CENTER, BOTTOM);
  text('r = ' + OPTS.previewR + (OPTS.lodOn ? '   (LOD weighting ON)' : ''), cx, height - 16);
}
function drawGalaxyView(){
  background(4,5,9);
  let playX=(PANELW+width)/2, playY=height/2, playW=width-PANELW;
  let hw=playW/(2*cam.zoom), hh=height/(2*cam.zoom);
  let vMinX=-cam.x-hw, vMaxX=-cam.x+hw, vMinY=-cam.y-hh, vMaxY=-cam.y+hh;   // visible world rect (cull)
  let baked = CFG.gen.bakedRender;
  let liveOverlay = baked && ['glow','streamers','bloom','core','rim','prom','embers'].some(L => OPTS[L+'On'] && CFG.sun['bake_'+L]===false);
  push();
  translate(playX, playY); translate(cam.x*cam.zoom, cam.y*cam.zoom); scale(cam.zoom);
  drawBackdrop();                                            // composite backdrop layers behind the stars
  let drawn=0;
  for(const s of galaxy){
    let wr = CFG.gen.starSize * (1 + (s.tier-1)*0.35);        // world star radius by tier
    let m = wr*6;                                             // cull margin for halos
    if(s.x<vMinX-m || s.x>vMaxX+m || s.y<vMinY-m || s.y>vMaxY+m) continue;
    if(baked){
      imageMode(CENTER); let sz=SUN_SPRITE_SZ*(wr/SUN_REF); image(getSunSprite(s.color), s.x, s.y, sz, sz);   // baked layers: 1 blit
      if(liveOverlay) drawTheSun(s.x, s.y, wr, frameCount, s.color, wr*cam.zoom, null, 'live', s.seed);         // non-baked layers, animated (per-star seed)
    } else drawTheSun(s.x, s.y, wr, frameCount, s.color, wr*cam.zoom, null, null, s.seed);                       // fully live
    drawn++;
  }
  pop();
  blendMode(BLEND); noStroke(); textAlign(LEFT, TOP); fill(120,140,175); textSize(11);
  text(galaxy.length+' stars · '+drawn+' drawn · '+(baked?('BAKED'+(liveOverlay?'+live':'')):'live')+' · '+sunSpriteCache.size+' sprites · zoom '+cam.zoom.toFixed(2)+'   [drag/wheel]', PANELW+12, 40);
}

// ---------- Phase 1: galaxy generation + camera ----------
let galaxy = [];                        // [{x,y,tier,color,seed}]
let cam = { x: 0, y: 0, zoom: 0.35 };   // world offset + zoom for the galaxy view
const SPECTRAL = [['M',[255,50,50]],['K',[255,140,0]],['G',[255,255,0]],['F',[240,240,255]],['B',[50,100,255]],['O',[150,50,255]]];
function randomSpectral(g){
  let w=[g.wM,g.wK,g.wG,g.wF,g.wB,g.wO], tot=(w[0]+w[1]+w[2]+w[3]+w[4]+w[5])||1, rr=random()*tot, acc=0, base=SPECTRAL[4][1];
  for(let i=0;i<6;i++){ acc+=w[i]; if(rr<=acc){ base=SPECTRAL[i][1]; break; } }
  let j=g.jitter;
  return [constrain(base[0]+random(-j,j),0,255), constrain(base[1]+random(-j,j),0,255), constrain(base[2]+random(-j,j),0,255)];
}
function generateGalaxy(g){
  randomSeed(g.seed|0);
  galaxy=[];
  let N=g.starCount|0, R=g.radius, minD=g.minDist;
  let nT3=Math.round(N*0.03), nT2=Math.round(N*0.13), nT1=N-nT2-nT3;
  let tiers=[]; for(let i=0;i<nT1;i++)tiers.push(1); for(let i=0;i<nT2;i++)tiers.push(2); for(let i=0;i<nT3;i++)tiers.push(3);
  for(let i=tiers.length-1;i>0;i--){ let jx=Math.floor(random()*(i+1)); let tmp=tiers[i]; tiers[i]=tiers[jx]; tiers[jx]=tmp; }
  let placed=0, attempts=0, capA=N*300;
  while(placed<N && attempts<capA){
    attempts++;
    let x,y;
    if(g.useGalaxy01){                     // galaxy_01 rules: continuous, min-distance reject
      x=random(-R,R); y=random(-R,R); if(x*x+y*y>R*R) continue;
      let ok=true; for(const s of galaxy){ let dx=s.x-x, dy=s.y-y; if(dx*dx+dy*dy<minD*minD){ ok=false; break; } }
      if(!ok) continue;
    } else {                               // IE (placeholder): uniform across the disc, no min-dist
      let a=random(TWO_PI), rr=R*Math.sqrt(random()); x=cos(a)*rr; y=sin(a)*rr;
    }
    galaxy.push({ x, y, tier: tiers[placed]||1, color: randomSpectral(g), seed: placed*997+1 });
    placed++;
  }
}
// ---------- baked sun sprites (per spectral-color cache) for VIEW GALAXY ----------
const SUN_REF = 40, SUN_SPRITE_SZ = 640;   // sprite baked at radius SUN_REF; buffer holds the halos
let sunSpriteCache = new Map();
function invalidateSunSprites(){ sunSpriteCache.clear(); }   // called when a sun setting changes -> re-bake lazily
function qColor(c){ return (Math.round(c[0]/12)*12)+','+(Math.round(c[1]/12)*12)+','+(Math.round(c[2]/12)*12); }
function getSunSprite(color){
  let key=qColor(color); let spr=sunSpriteCache.get(key);
  if(spr) return spr;
  spr=createGraphics(SUN_SPRITE_SZ, SUN_SPRITE_SZ); spr.pixelDensity(1);
  let sc=OPTS.sunColor, sl=OPTS.lodOn; OPTS.sunColor=color; OPTS.lodOn=false;   // bake full-strength composite in this color
  drawTheSun(SUN_SPRITE_SZ/2, SUN_SPRITE_SZ/2, SUN_REF, 0, color, null, spr, 'bake');   // frozen frame, baked layers only
  OPTS.sunColor=sc; OPTS.lodOn=sl;
  sunSpriteCache.set(key, spr);
  return spr;
}
// ---------- Backdrop (composite layers rendered behind the galaxy) ----------
let bdBuf={}, bdDirty=true;                                                   // per-layer baked buffers + rebuild flag
function bdExtent(){ return CFG.gen.radius * CFG.backdrop.cover; }             // world half-size the backdrop covers
function invalidateBackdrop(){ bdDirty=true; }                               // rebuild baked layer buffers lazily next frame
function bdHash(i,s){ let x=Math.sin(i*127.1 + s*311.7)*43758.5453; return x-Math.floor(x); }   // seeded 0..1
const BD_LAYERS = ['base','img','neb','grid','fade'];                          // bottom -> top stacking order
const BD_BLEND  = { base:'blend', img:'blend', neb:'add', grid:'blend', fade:'blend' };   // per-layer blit blend mode
function drawOneBdLayer(P, E, L){
  let B=CFG.backdrop;
  if(L==='base')      bd_base (P,E,B);
  else if(L==='img')  bd_image(P,E,B);
  else if(L==='neb')  bd_neb  (P,E,B);
  else if(L==='grid') bd_grid (P,E,B);
  else if(L==='fade') bd_fade (P,E,B);
}
let bdImgCache = {};    // index -> p5.Image once loaded ('loading' in flight, false on error)
function bdGetImg(idx){
  idx = ((idx % BD_IMGS.length) + BD_IMGS.length) % BD_IMGS.length;
  let c = bdImgCache[idx];
  if(c==='loading' || c===false) return null;
  if(c) return c;
  bdImgCache[idx]='loading';
  loadImage(BD_IMGS[idx], im=>{ bdImgCache[idx]=im; invalidateBackdrop(); }, ()=>{ bdImgCache[idx]=false; });
  return null;                                              // not ready this frame; re-bakes when the load resolves
}
function bdImgPick(B){
  if(!B.imgHashPick) return { idx:B.imgIndex, rot:B.imgRot, flip:B.imgFlip };
  let h=(CFG.gen.seed|0);                                   // hash-driven: deterministic image/rot/flip from the galaxy seed
  return { idx:Math.floor(bdHash(1,h)*BD_IMGS.length), rot:Math.floor(bdHash(2,h)*4), flip:bdHash(3,h)<0.5 };
}
function bd_image(P,E,B){
  let pk=bdImgPick(B), img=bdGetImg(pk.idx);
  if(!img) return;
  P.push(); P.imageMode(CENTER);
  P.rotate(pk.rot*HALF_PI); if(pk.flip) P.scale(-1,1);
  let s=(2*E)/Math.min(img.width,img.height)*B.imgScale;    // cover the square; radial fade masks the overflow edges
  let dc=P.drawingContext, pa=dc.globalAlpha; dc.globalAlpha=B.imgOpacity;   // opacity via globalAlpha — avoids p5 tint's per-pixel cost
  P.image(img, 0,0, img.width*s, img.height*s);
  dc.globalAlpha=pa; P.pop();
}
function bd_base(P,E,B){
  P.push(); P.noStroke(); P.rectMode(CENTER);
  P.fill(B.baseColor[0],B.baseColor[1],B.baseColor[2],255*B.baseOpacity);
  P.rect(0,0,2*E,2*E); P.pop();
}
// ---- procedural noise nebula (domain-warp / fBm / emission), rendered once to a texture, stepped over time ----
const NEB_RES=176;
let nebCur=null, nebNext=null, nebBlendTex=null, nbCurPx=null, nbNextPx=null, nebT=0, nebTnext=0, nbRenderT=0, nebFadeAmt=0, nebFading=false, nebFadeStart=0, lastNebStep=0, lastNebStaticSig='';
function nbSmooth(a,b,x){ let t=constrain((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function nbFbm(x,y,oct){ let a=0.5,f=1,s=0,n=0; for(let o=0;o<oct;o++){ s+=a*noise(x*f,y*f,nbRenderT); n+=a; a*=0.5; f*=2; } return s/n; }
function nbWarp(x,y,oct,w){ let q1=nbFbm(x+1.7,y+9.2,oct), q2=nbFbm(x+5.2,y+1.3,oct); return nbFbm(x+w*q1, y+w*q2, oct); }
function nbField(x,y,B){ let oct=B.nebOctaves|0;
  if(B.nebType==='fbm')      return nbFbm(x,y,oct);
  if(B.nebType==='emission') return constrain(nbFbm(x,y,oct)-0.7*Math.max(0,nbFbm(x+11,y+7,3)-0.45),0,1);
  return nbWarp(x,y,oct,B.nebWarp);                                            // domainwarp (default)
}
function nbPalette(t,B){ t=constrain(t,0,1);
  if(t<0.5){ let u=t*2; return [lerp(B.nebColorA[0],B.nebColorB[0],u),lerp(B.nebColorA[1],B.nebColorB[1],u),lerp(B.nebColorA[2],B.nebColorB[2],u)]; }
  let u=(t-0.5)*2; return [lerp(B.nebColorB[0],B.nebColorC[0],u),lerp(B.nebColorB[1],B.nebColorC[1],u),lerp(B.nebColorB[2],B.nebColorC[2],u)];
}
function nebSigStatic(B){ return [B.nebType,B.nebScale,B.nebOctaves,B.nebWarp,B.nebContrast,B.nebThreshold,B.nebOpacity,B.nebSeed,
  B.nebColorA.join(','),B.nebColorB.join(','),B.nebColorC.join(',')].join('|'); }                                 // params only, not time
function renderNebInto(tex, tval, B){                                          // pixel-fill the field at time tval (expensive; once per step or param change)
  if(!tex) return;
  nbRenderT=tval; noiseSeed(B.nebSeed|0);
  tex.clear(); tex.loadPixels();
  let R=NEB_RES, S=B.nebScale*4, C=B.nebContrast, th=B.nebThreshold, op=B.nebOpacity, px=tex.pixels;
  for(let yy=0;yy<R;yy++) for(let xx=0;xx<R;xx++){
    let v=Math.pow(constrain(nbField((xx/R)*S,(yy/R)*S,B),0,1), C);
    let a=nbSmooth(th,1,v)*op, col=nbPalette(v,B), o=4*(yy*R+xx);
    px[o]=col[0]|0; px[o+1]=col[1]|0; px[o+2]=col[2]|0; px[o+3]=Math.min(255,a*255)|0;
  }
  tex.updatePixels();
}
function ensureNeb(B){                                                         // lazily create the textures; re-render on a parameter change
  if(!nebCur){ nebCur=createGraphics(NEB_RES,NEB_RES); nebCur.pixelDensity(1); nebNext=createGraphics(NEB_RES,NEB_RES); nebNext.pixelDensity(1);
    nebBlendTex=createGraphics(NEB_RES,NEB_RES); nebBlendTex.pixelDensity(1); nebBlendTex.loadPixels();
    renderNebInto(nebCur, nebT, B); lastNebStaticSig=nebSigStatic(B); return; }
  let sig=nebSigStatic(B);
  if(sig!==lastNebStaticSig){ renderNebInto(nebCur, nebT, B); lastNebStaticSig=sig; nebFading=false; nebFadeAmt=0; }
}
function lerpNebPixels(f){                                                     // true cross-dissolve: out = cur*(1-f) + next*f (per channel incl. alpha)
  let a=nbCurPx, b=nbNextPx, o=nebBlendTex.pixels; if(!a||!b||!o) return;
  for(let i=0;i<o.length;i++) o[i]=a[i]+(b[i]-a[i])*f;
  nebBlendTex.updatePixels();
}
function nbDrawTex(P,E,B){                                                     // blit current, or the dissolved cur->next texture mid-step
  ensureNeb(B);
  let tex=nebCur;
  if(nebFading && nebFadeAmt>0){ lerpNebPixels(constrain(nebFadeAmt,0,1)); tex=nebBlendTex; }
  P.push(); P.imageMode(CENTER); P.image(tex, 0,0, 2*E, 2*E); P.pop();
}
function stepNebula(B){                                                        // per-frame: hold for Interval, then crossfade one Step over Blend seconds
  if(!(B.nebOn && B.nebAnimOn && B.nebType!=='blobs')){ nebFading=false; return; }
  if(nebFading){
    nebFadeAmt = B.nebBlend>0 ? (millis()-nebFadeStart)/(B.nebBlend*1000) : 1;
    if(nebFadeAmt>=1){ let tmp=nebCur; nebCur=nebNext; nebNext=tmp; nebT=nebTnext; nebFadeAmt=0; nebFading=false; lastNebStep=millis(); invalidateBackdrop(); }
  } else if(nebCur && millis()-lastNebStep > B.nebInterval*1000){
    nebTnext=nebT+B.nebStep; renderNebInto(nebNext, nebTnext, B);                // render the next frame...
    nebCur.loadPixels(); nebNext.loadPixels(); nbCurPx=nebCur.pixels; nbNextPx=nebNext.pixels;   // ...cache both for the dissolve
    nebFadeAmt=0; nebFadeStart=millis(); nebFading=true;
  }
}
function bd_neb(P,E,B){
  if(B.nebType && B.nebType!=='blobs'){ nbDrawTex(P,E,B); return; }            // procedural noise nebula (texture)
  P.push(); P.noStroke(); P.blendMode(ADD);
  let n=B.nebCount|0;
  for(let i=0;i<n;i++){
    let a=bdHash(i,B.nebSeed)*TWO_PI, rr=E*0.9*Math.pow(bdHash(i+50,B.nebSeed),2);   // center-biased: dense core, fades outward
    let x=Math.cos(a)*rr, y=Math.sin(a)*rr;
    let rad=E*(0.12+0.35*bdHash(i+100,B.nebSeed))*B.nebScale;
    let t=bdHash(i+150,B.nebSeed);
    let col=[lerp(B.nebColorA[0],B.nebColorB[0],t),lerp(B.nebColorA[1],B.nebColorB[1],t),lerp(B.nebColorA[2],B.nebColorB[2],t)];
    let g=P.drawingContext.createRadialGradient(x,y,0,x,y,rad);
    g.addColorStop(0, rgba(col, 0.5*B.nebOpacity)); g.addColorStop(1, rgba(col, 0));
    P.drawingContext.fillStyle=g; P.circle(x,y,rad*2);
  }
  P.pop(); P.blendMode(BLEND);
}
function bd_grid(P,E,B){
  P.push(); P.noFill(); P.strokeWeight(B.gridWeight);
  P.stroke(B.gridColor[0],B.gridColor[1],B.gridColor[2],255*B.gridOpacity);
  let sp=B.gridSpacing;
  for(let x=0;x<=E;x+=sp){ P.line(x,-E,x,E); if(x>0) P.line(-x,-E,-x,E); }
  for(let y=0;y<=E;y+=sp){ P.line(-E,y,E,y); if(y>0) P.line(-E,-y,E,-y); }
  P.pop();
}
function bd_fade(P,E,B){
  P.push(); P.noStroke(); P.rectMode(CENTER);
  let ri=Math.min(B.fadeInner,B.fadeOuter), ro=Math.max(B.fadeInner,B.fadeOuter)+0.001;   // order-independent: clear inside, opaque outside (never inverts)
  let g=P.drawingContext.createRadialGradient(0,0,E*ri,0,0,E*ro);
  g.addColorStop(0, rgba(B.fadeColor,0)); g.addColorStop(1, rgba(B.fadeColor,B.fadeOpacity));
  P.drawingContext.fillStyle=g; P.rect(0,0,2*E,2*E); P.pop();
}
function bakeBdLayer(L, E, res){                                              // render one layer into its own transparent buffer
  let b=bdBuf[L];
  if(!b || b.width!==res){ b=createGraphics(res,res); b.pixelDensity(1); bdBuf[L]=b; }
  b.clear();
  b.push(); b.translate(res/2,res/2); b.scale(res/(2*E));                     // buffer space -> world [-E,E]^2
  drawOneBdLayer(b, E, L);
  b.pop();
  return b;
}
function drawBackdrop(){                                                      // called inside a transform; composites layers in stack order
  let E=bdExtent(), res=CFG.backdrop.bakeRes|0, B=CFG.backdrop;
  for(const L of BD_LAYERS){
    if(!B[L+'On']) continue;
    if(B['bake_'+L]!==false){                                                 // baked: blit this layer's own buffer (rebuild if dirty/resized)
      let b=bdBuf[L];
      if(bdDirty || !b || b.width!==res || (L==='neb' && nebFading)) b=bakeBdLayer(L, E, res);   // re-bake neb each frame during the crossfade
      push(); if(BD_BLEND[L]==='add') blendMode(ADD); imageMode(CENTER); image(b, 0,0, 2*E, 2*E); pop();
    } else {                                                                  // live: draw directly, at its position in the stack
      drawOneBdLayer(window, E, L);
    }
  }
  bdDirty=false;
}
function regenerate(){ generateGalaxy(CFG.gen); invalidateBackdrop(); }       // radius change -> extent change -> re-bake
function reroll(){ CFG.gen.seed = Math.floor(Math.random()*99999); regenerate(); }
function mouseDragged(){ if(viewMode==='galaxy' && mouseX>PANELW){ cam.x += (mouseX-pmouseX)/cam.zoom; cam.y += (mouseY-pmouseY)/cam.zoom; } }
function mouseWheel(e){ if(viewMode==='galaxy' && mouseX>PANELW){ cam.zoom = constrain(cam.zoom*(e.delta>0?0.9:1.1), 0.05, 6); return false; } }
function toggleMode(){ viewMode = (viewMode==='options') ? 'galaxy' : 'options'; updateModeBtn(); }
function updateModeBtn(){ let b=document.getElementById('mode-btn'); if(b) b.innerHTML = (viewMode==='options') ? '&#9654; VIEW GALAXY' : '&#9664; OPTIONS'; }
function exportCFG(){
  let blob=new Blob([JSON.stringify(CFG,null,2)],{type:'application/json'});
  let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='galaxy_cfg.json'; a.click();
}
function importCFG(file){
  let rd=new FileReader();
  rd.onload=()=>{ try{ let c=JSON.parse(rd.result);
    for(const sec in CFG){ if(c[sec]) Object.assign(CFG[sec], c[sec]); }
    invalidateSunSprites(); invalidateBackdrop();
    showPage();
  }catch(err){ alert('Bad config JSON: '+err.message); } };
  rd.readAsText(file);
}

// ---------- FPS counter + persistent record sheet ----------
const FPS_KEY='galaxy_studio_fps';
let fpsSession={min:Infinity,max:0,sum:0,count:0};
let fpsAll={min:Infinity,max:0,sum:0,count:0,since:null};
let fpsSheetOpen=false, lastFpsSample=0;
function isoDate(){ let d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function loadFpsRecords(){ try{ let s=localStorage.getItem(FPS_KEY); if(s){ let o=JSON.parse(s);
  fpsAll={min:(o.min!=null?o.min:Infinity), max:o.max||0, sum:o.sum||0, count:o.count||0, since:o.since||null}; } }catch(e){} }
function saveFpsRecords(){ try{ localStorage.setItem(FPS_KEY, JSON.stringify(fpsAll)); }catch(e){} }
function updateFps(){
  if (millis()-lastFpsSample < 500) return;      // sample twice a second
  lastFpsSample=millis();
  let f=Math.round(frameRate());
  let pill=document.getElementById('fps-pill'); if(pill) pill.textContent='FPS '+(f>0?f:'—');
  if(f<=0) return;
  fpsSession.min=Math.min(fpsSession.min,f); fpsSession.max=Math.max(fpsSession.max,f); fpsSession.sum+=f; fpsSession.count++;
  fpsAll.min=Math.min(fpsAll.min,f); fpsAll.max=Math.max(fpsAll.max,f); fpsAll.sum+=f; fpsAll.count++;
  if(!fpsAll.since) fpsAll.since=isoDate();
  saveFpsRecords();
  if(fpsSheetOpen) renderFpsSheet();
}
function toggleFpsSheet(){ fpsSheetOpen=!fpsSheetOpen; let el=document.getElementById('fps-sheet');
  if(el){ el.style.display=fpsSheetOpen?'block':'none'; if(fpsSheetOpen) renderFpsSheet(); } }
function renderFpsSheet(){
  let el=document.getElementById('fps-sheet'); if(!el) return;
  let sAvg=fpsSession.count?Math.round(fpsSession.sum/fpsSession.count):'—';
  let aAvg=fpsAll.count?Math.round(fpsAll.sum/fpsAll.count):'—';
  let sMin=fpsSession.count?fpsSession.min:'—', aMin=fpsAll.count?fpsAll.min:'—';
  el.innerHTML='<div class="fps-h">FPS RECORDS</div>'+
    '<table><tr><th></th><th>min</th><th>avg</th><th>max</th></tr>'+
    '<tr><td>session</td><td>'+sMin+'</td><td>'+sAvg+'</td><td>'+(fpsSession.max||'—')+'</td></tr>'+
    '<tr><td>all-time</td><td>'+aMin+'</td><td>'+aAvg+'</td><td>'+(fpsAll.max||'—')+'</td></tr></table>'+
    '<div class="fps-meta">all-time since '+(fpsAll.since||'—')+' · '+fpsAll.count+' samples (persists across reloads)</div>'+
    '<button id="fps-reset">Reset all-time</button>';
  document.getElementById('fps-reset').onclick=resetFpsRecords;
}
function resetFpsRecords(){
  fpsAll={min:Infinity,max:0,sum:0,count:0,since:isoDate()};
  fpsSession={min:Infinity,max:0,sum:0,count:0};
  saveFpsRecords(); renderFpsSheet();
}

// ---------- helpers ----------
function frac(x){ return x - Math.floor(x); }
function hash01(s){ let x=Math.sin(s*12.9898)*43758.5453; return x-Math.floor(x); }   // 0..1 pseudo-random per seed
function rgba(c,a){ return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a+')'; }
function bakePlasma(){ let g=plasmaBuf; g.loadPixels(); let n=BUFN, cc=(n-1)/2, R=n/2;
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){ let nv=noise(x*0.045,y*0.045,3.1); let bri=90+nv*165;
    let d=Math.hypot(x-cc,y-cc), a = d<=R*0.62?255:(d>=R?0:255*(1-(d-R*0.62)/(R-R*0.62)));
    let i=4*(y*n+x); g.pixels[i]=bri; g.pixels[i+1]=bri; g.pixels[i+2]=bri; g.pixels[i+3]=a;
  } g.updatePixels();
}
function bakeFilament(){ let g=filaBuf; g.loadPixels(); let n=BUFN, cc=(n-1)/2, R=n/2;
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){ let wx=noise(x*0.03,y*0.03,10)*6, wy=noise(x*0.03+5,y*0.03+5,20)*6;
    let nv=pow(noise((x+wx)*0.06,(y+wy)*0.06,7),1.6); let bri=60+nv*195;
    let d=Math.hypot(x-cc,y-cc), a = d<=R*0.62?255:(d>=R?0:255*(1-(d-R*0.62)/(R-R*0.62)));
    let i=4*(y*n+x); g.pixels[i]=bri; g.pixels[i+1]=bri; g.pixels[i+2]=bri; g.pixels[i+3]=a;
  } g.updatePixels();
}

// ---------- composite ----------
// which layers to draw for a given pass: filter null = all on-layers (preview);
// 'bake' = only layers flagged to bake; 'live' = the on-layers NOT baked (drawn per-frame over the sprite)
function layerOn(layer, filter){
  if(!OPTS[layer+'On']) return false;
  if(!filter) return true;
  let baked = CFG.sun['bake_'+layer] !== false;   // default: included in the bake
  return filter==='bake' ? baked : !baked;
}
// g = target graphics (offscreen buffer when baking); defaults to the main canvas (window) for live draw
function drawTheSun(cx,cy,r,t,col,lodR,g,filter,seed){
  let P = g || window;
  let R = col || OPTS.sunColor;
  let lr = (lodR!=null) ? lodR : r;                                 // on-screen radius drives LOD (galaxy view passes r*zoom)
  let lodH = OPTS.lodOn ? constrain(map(lr,20,70,1,0),0,1) : 1;     // halo weight (fades in as you zoom OUT)
  let lodC = OPTS.lodOn ? constrain(map(lr,7,70,0.25,1),0,1) : 1;   // core weight (fades in as you zoom IN)
  P.push(); P.translate(cx,cy);
  if(layerOn('glow',filter))      fx_glow(P,r,R,lodH);
  if(layerOn('streamers',filter)) fx_streamers(P,r,R,t,lodH);
  if(layerOn('bloom',filter))     fx_bloom(P,r,R,t,lodH,seed);
  if(layerOn('core',filter))      fx_core(P,r,R,t,lodC);
  if(layerOn('rim',filter))       fx_rim(P,r,R,lodC);
  if(layerOn('prom',filter))      fx_prominence(P,r,R,t,lodH);
  if(layerOn('embers',filter))    fx_embers(P,r,R,t,lodH);
  P.pop(); P.blendMode(BLEND);
}

function fx_core(P,r,R,t,lod){
  let cw = OPTS.coreOpacity*lod; if(cw<=0.001) return;
  let e = constrain(1-OPTS.edge, 0.02, 1.0);
  P.push(); P.noStroke(); P.blendMode(BLEND);
  let sg=P.drawingContext.createRadialGradient(0,0,r*0.05,0,0,r);
  sg.addColorStop(0,               rgba([255,252,235],cw));
  sg.addColorStop(min(0.45,e*0.7), rgba(R,cw));
  sg.addColorStop(e,               rgba([R[0]*0.55,R[1]*0.30,R[2]*0.12],cw));
  sg.addColorStop(1,               rgba([R[0]*0.55,R[1]*0.30,R[2]*0.12],0));
  P.drawingContext.fillStyle=sg; P.circle(0,0,r*2);
  if(OPTS.plasmaOn){ P.push(); P.imageMode(CENTER); P.blendMode(BLEND); P.rotate(t*0.003*OPTS.rot);
    P.tint(R[0],R[1],R[2],255*OPTS.plasmaOpacity*lod); P.image(plasmaBuf,0,0,r*2,r*2); P.noTint(); P.pop(); }
  if(OPTS.filamentOn){ P.push(); P.imageMode(CENTER); P.blendMode(ADD); P.rotate(-t*0.002*OPTS.rot);
    P.tint(R[0],R[1],R[2],255*OPTS.filamentOpacity*lod); P.image(filaBuf,0,0,r*2,r*2); P.noTint(); P.pop(); P.blendMode(BLEND); }
  if(OPTS.specOn){ let hs=P.drawingContext.createRadialGradient(-r*0.18,-r*0.18,0,-r*0.18,-r*0.18,r*0.6);
    hs.addColorStop(0,rgba([255,255,245],0.32*cw)); hs.addColorStop(1,rgba([255,255,245],0));
    P.drawingContext.fillStyle=hs; P.circle(-r*0.18,-r*0.18,r*1.2); }
  P.pop();
}
function fx_glow(P,r,R,lod){
  let w=OPTS.glowOpacity*lod; if(w<=0.001) return;
  P.push(); P.blendMode(ADD); P.noStroke();
  let g=P.drawingContext.createRadialGradient(0,0,r*0.2,0,0,r*OPTS.glowSize);
  g.addColorStop(0,rgba([255,240,200],0.5*w)); g.addColorStop(0.35,rgba(R,0.16*w)); g.addColorStop(1,rgba([255,90,0],0));
  P.drawingContext.fillStyle=g; P.circle(0,0,r*OPTS.glowSize*2.1);
  P.pop(); P.blendMode(BLEND);
}
function fx_streamers(P,r,R,t,lod){
  let w=OPTS.streamersOpacity*lod; if(w<=0.001) return;
  P.push(); P.blendMode(ADD); P.rotate(t*0.0015*OPTS.rot); P.noStroke();
  let N=OPTS.streamerCount;
  for(let i=0;i<N;i++){ let a=i/N*TWO_PI;
    let len=r*OPTS.streamerLen*(0.6+0.4*(0.5+0.5*sin(i*2.3+t*0.01)));
    P.push(); P.rotate(a);
    let g=P.drawingContext.createLinearGradient(0,0,len,0); g.addColorStop(0,rgba(R,0.2*w)); g.addColorStop(1,rgba(R,0));
    P.drawingContext.fillStyle=g; let wd=r*0.5;
    P.beginShape(); P.vertex(0,-wd*0.3); P.vertex(len,-wd); P.vertex(len,wd); P.vertex(0,wd*0.3); P.endShape(CLOSE);
    P.pop();
  }
  P.pop(); P.blendMode(BLEND);
}
function fx_bloom(P,r,R,t,lod,seed){
  let w=OPTS.bloomOpacity*lod; if(w<=0.001) return;
  let sd = (seed!=null) ? seed : 42;                                  // fixed example seed for the single-sun preview
  let rnd = OPTS.bloomRandom;
  let randAng = rnd && !OPTS.bloomLockAngle;                                                  // per-star initial orientation
  let randRot = rnd && !OPTS.bloomLockRot;                                                    // per-star rotation speed
  let angJit = randAng ? ((hash01(sd*1.91)<0.5?-1:1) * (1 + hash01(sd*1.13)*44) * (PI/180)) : 0;  // initial angle jitter +/-1..45 deg
  let spd    = randRot ? (0.3 + hash01(sd*2.71+1.7)*1.4) : 1;                                 // pulse speed (rotation base)
  let rotSpd = OPTS.bloomLockRot ? 0 : spd;                                                    // rotation drift — locked = 0 (frozen, no spin)
  let lenPh  = rnd ? hash01(sd*3.77+5.5)*TWO_PI      : 0;                                     // random initial spike length (phase)
  let growR  = rnd ? hash01(sd*4.31+2.9)*5           : 0;                                     // spike grow/shrink rate 0..5
  P.push(); P.blendMode(ADD); P.noStroke();
  P.rotate(OPTS.bloomAngle*TWO_PI + angJit + t*0.0005*OPTS.rot*rotSpd);
  if(OPTS.bloomGlow){                                                 // built-in center glow — off to de-dup with the Glow layer
    let g=P.drawingContext.createRadialGradient(0,0,0,0,0,r*2.6);
    g.addColorStop(0,rgba([255,250,235],0.9*w)); g.addColorStop(0.4,rgba(R,0.4*w)); g.addColorStop(1,rgba(R,0));
    P.drawingContext.fillStyle=g; P.circle(0,0,r*5.2);
  }
  let lenMult = rnd ? (2.0 + 2.0*sin(lenPh + t*growR*0.01)) : OPTS.bloomLen;   // oscillates 0..4 at growR (rate 0 = static random len)
  let L=r*lenMult, tw=r*OPTS.bloomThick, pulse=0.85+0.15*sin(t*0.05*spd + lenPh);
  for(let s=0;s<2;s++){ P.push(); P.rotate(s*HALF_PI);
    let lg=P.drawingContext.createLinearGradient(-L,0,L,0);
    lg.addColorStop(0,rgba([255,250,235],0)); lg.addColorStop(0.5,rgba([255,250,235],0.5*pulse*w)); lg.addColorStop(1,rgba([255,250,235],0));
    P.drawingContext.fillStyle=lg; P.rect(-L,-tw/2,2*L,tw); P.pop();
  }
  for(let s=0;s<2;s++){ P.push(); P.rotate(QUARTER_PI+s*HALF_PI);
    let lg=P.drawingContext.createLinearGradient(-L*0.6,0,L*0.6,0);
    lg.addColorStop(0,rgba(R,0)); lg.addColorStop(0.5,rgba(R,0.2*pulse*w)); lg.addColorStop(1,rgba(R,0));
    P.drawingContext.fillStyle=lg; P.rect(-L*0.6,-tw*0.4,L*1.2,tw*0.8); P.pop();
  }
  P.pop(); P.blendMode(BLEND);
}
function fx_rim(P,r,R,lod){
  let w=OPTS.rimOpacity*lod; if(w<=0.001) return;
  P.push(); P.noFill(); P.blendMode(ADD);
  P.strokeWeight(max(r*OPTS.rimThick,1)); P.stroke(rgba([255,120,60],0.5*w)); P.circle(0,0,r*2*0.99);
  P.strokeWeight(max(r*OPTS.rimThick*0.5,0.6)); P.stroke(rgba([255,220,180],0.6*w)); P.circle(0,0,r*2*0.985);
  P.pop(); P.blendMode(BLEND);
}
function fx_prominence(P,r,R,t,lod){
  let w=OPTS.promOpacity*lod; if(w<=0.001) return;
  P.push(); P.blendMode(ADD); P.noFill();
  let N=OPTS.promCount;
  for(let i=0;i<N;i++){ let a=i/N*TWO_PI + (noise(i*3.1)*0.6-0.3) + t*0.003*OPTS.rot;
    let spread=0.16+noise(i*1.7)*0.16;
    let fx=cos(a-spread)*r, fy=sin(a-spread)*r, gx=cos(a+spread)*r, gy=sin(a+spread)*r;
    let h=r*OPTS.promHeight*(0.85 + (0.5+0.5*sin(t*0.05+i*1.3))*0.4*(0.5+noise(i*2.3)));
    P.strokeWeight(max(r*0.035,1)); P.stroke(255,120+40*sin(t*0.05+i),50,150*w);
    P.beginShape(); P.vertex(fx,fy); P.quadraticVertex(cos(a)*h,sin(a)*h,gx,gy); P.endShape();
  }
  P.pop(); P.blendMode(BLEND);
}
function fx_embers(P,r,R,t,lod){
  let w=OPTS.embersOpacity*lod; if(w<=0.001) return;
  P.push(); P.blendMode(ADD); P.noStroke();
  let N=OPTS.embersCount;
  for(let i=0;i<N;i++){ let rnd=frac(sin(i*127.1)*43758.5), rnd2=frac(sin(i*311.7)*24634.6);
    let a=(i/N)*TWO_PI + t*0.01*OPTS.rot*(0.5+rnd2);
    let rad=r*(0.9+1.3*rnd)+sin(t*0.03+i)*r*0.1;
    let x=cos(a)*rad, y=sin(a)*rad; let br=constrain(1-rad/(r*2.2),0,1);
    P.fill(255,150+br*90,50,(20+br*150)*w); P.circle(x,y,0.8+br*2.2);
  }
  P.pop(); P.blendMode(BLEND);
}

let activePage = 'sun';
function rgbToHex(c){ return '#'+[0,1,2].map(i=>('0'+(c[i]|0).toString(16)).slice(-2)).join(''); }
function hexToRgb(h){ return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)]; }
let controls = {};        // key -> {type, input, val} for the CURRENT page (rebuilt on page switch)
let presetSel = null;
function buildNav(){
  let nav=document.getElementById('nav'); nav.innerHTML='';
  for(const p of PAGES){
    let b=document.createElement('button'); b.className='tab'+(p.id===activePage?' on':''); b.textContent=p.label;
    b.onclick=()=>{ activePage=p.id; showPage(); };
    nav.appendChild(b);
  }
}
function showPage(){
  buildNav();
  let body=document.getElementById('pagebody'); body.innerHTML=''; controls={}; presetSel=null;
  let page=PAGES.find(p=>p.id===activePage);
  if(page.presets) buildPresetRow(body);
  if(!page.schema.length){
    let note=document.createElement('div'); note.className='hint';
    note.textContent='No options here yet — this page fills in a later phase.';
    body.appendChild(note); return;
  }
  buildControls(page.schema, page.target(), body, page.onChange);
  if(page.id==='gen'){
    let rb=document.createElement('button'); rb.className='act-btn'; rb.textContent='Regenerate (new seed)';
    rb.onclick=reroll; body.appendChild(rb);
  }
  let hint=document.createElement('div'); hint.className='hint';
  hint.textContent = (page.id==='gen')
    ? 'Changes regenerate live. Hit ▶ VIEW GALAXY (top-left) to see it — drag to pan, wheel to zoom.'
    : 'Toggle any layer or drag any value — updates live.';
  body.appendChild(hint);
}
function buildPresetRow(body){
  let pr=document.createElement('div'); pr.className='row';
  let pl=document.createElement('span'); pl.className='lab'; pl.textContent='Preset'; pr.appendChild(pl);
  presetSel=document.createElement('select');
  for(const k of Object.keys(PRESETS)){ let o=document.createElement('option'); o.value=k; o.textContent=PRESET_LABELS[k]||k; presetSel.appendChild(o); }
  presetSel.value=ACTIVE_PRESET;
  presetSel.onchange=()=>applyPreset(presetSel.value);
  pr.appendChild(presetSel); body.appendChild(pr);
  let ph=document.createElement('div'); ph.className='hint'; ph.style.margin='2px 0 4px'; ph.textContent='pick a sun version, or press [ / ] to cycle'; body.appendChild(ph);
}
function buildControls(schema, target, body, onChange){
  for(const [group, items] of schema){
    let h=document.createElement('div'); h.className='grp'; h.textContent=group; body.appendChild(h);
    for(const item of items){
      let key=item[0], label=item[1], type=item[2];
      let row=document.createElement('label'); row.className='row';
      let lab=document.createElement('span'); lab.className='lab'; lab.textContent=label; row.appendChild(lab);
      if(type==='bool'){
        let inp=document.createElement('input'); inp.type='checkbox'; inp.checked=!!target[key];
        inp.oninput=()=>{ target[key]=inp.checked; if(onChange) onChange(); }; row.appendChild(inp);
        controls[key]={type, input:inp};
      } else if(type==='range'){
        let inp=document.createElement('input'); inp.type='range'; inp.min=item[3]; inp.max=item[4]; inp.step=item[5]; inp.value=target[key];
        let val=document.createElement('span'); val.className='val'; val.textContent=target[key];
        inp.oninput=()=>{ target[key]=parseFloat(inp.value); val.textContent=inp.value; if(onChange) onChange(); };
        row.appendChild(inp); row.appendChild(val);
        controls[key]={type, input:inp, val};
      } else if(type==='color'){
        let inp=document.createElement('input'); inp.type='color'; inp.value=rgbToHex(target[key]);
        inp.oninput=()=>{ target[key]=hexToRgb(inp.value); if(onChange) onChange(); }; row.appendChild(inp);
        controls[key]={type, input:inp};
      } else if(type==='select'){
        let inp=document.createElement('select'); let opts=item[3]||[];
        for(const [v,l] of opts){ let o=document.createElement('option'); o.value=v; o.textContent=l; inp.appendChild(o); }
        inp.value=target[key];
        inp.oninput=()=>{ let v=inp.value; target[key]=(/^-?\d+$/.test(v)?parseInt(v):v); if(onChange) onChange(); }; row.appendChild(inp);
        controls[key]={type, input:inp};
      }
      body.appendChild(row);
    }
  }
}
function refreshPanel(){
  for(const key in controls){ let c=controls[key];
    if(c.type==='bool') c.input.checked=!!OPTS[key];
    else if(c.type==='range'){ c.input.value=OPTS[key]; if(c.val) c.val.textContent=OPTS[key]; }
    else if(c.type==='color') c.input.value=rgbToHex(OPTS[key]);
    else if(c.type==='select') c.input.value=OPTS[key];
  }
  if(presetSel) presetSel.value=ACTIVE_PRESET;
}
function applyPreset(name){
  if(!PRESETS[name]) return;
  ACTIVE_PRESET=name;
  let merged=JSON.parse(JSON.stringify(BASE));              // reset to base defaults...
  let ov=JSON.parse(JSON.stringify(PRESETS[name]));         // ...then apply this preset's overrides
  for(const k in ov) merged[k]=ov[k];
  for(const k in merged) OPTS[k]=merged[k];
  refreshPanel();
  invalidateSunSprites();   // preset changed the sun -> rebuild baked sprites
  let tag=document.getElementById('preset-tag'); if(tag) tag.textContent='· '+(PRESET_LABELS[name]||name);
}
function keyPressed(){
  if(activePage!=='sun') return;   // preset cycling lives on the Sun page
  let keys=Object.keys(PRESETS), i=keys.indexOf(ACTIVE_PRESET);
  if(key===']') applyPreset(keys[(i+1)%keys.length]);
  else if(key==='[') applyPreset(keys[(i-1+keys.length)%keys.length]);
}
